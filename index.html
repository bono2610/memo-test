<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모장</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background:#f5f7fb; margin:0; padding:32px 16px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 16px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:12px; border:1px solid #ccd; border-radius:8px; font-size:15px; }
  button { padding:12px 18px; border:0; border-radius:8px; background:#2563eb; color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { background:#9ab; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; padding:12px 14px; border-radius:8px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .time { color:#888; font-size:12px; margin-top:4px; }
  #msg { color:#c00; font-size:14px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 메모장</h1>
  <form id="form">
    <input id="content" placeholder="메모를 입력하세요" required>
    <button id="btn" type="submit">저장</button>
  </form>
  <div id="msg"></div>
  <ul id="list"></ul>
</div>

<script>
  // ① Supabase 접속 정보 (publishable 키는 공개돼도 되는 키 — RLS가 지켜줌)
  const SUPABASE_URL = 'https://nychxvtenzefrmobfdgb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KaGr7gvmTlKjx113rnyE1g_No8_XyTi';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const list = document.getElementById('list');
  const msg  = document.getElementById('msg');

  // ② 목록 불러오기 (select)
  async function loadMemos() {
    const { data, error } = await db.from('memo').select('*').order('created_at', { ascending: false });
    if (error) { msg.textContent = '불러오기 오류: ' + error.message; return; }
    list.innerHTML = '';
    data.forEach(m => {
      const li = document.createElement('li');
      li.textContent = m.content;
      const t = document.createElement('div');
      t.className = 'time';
      t.textContent = new Date(m.created_at).toLocaleString('ko-KR');
      li.appendChild(t);
      list.appendChild(li);
    });
    if (data.length === 0) list.innerHTML = '<li style="color:#888">아직 메모가 없어요</li>';
  }

  // ③ 메모 저장하기 (insert)
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('content');
    const btn = document.getElementById('btn');
    btn.disabled = true; msg.textContent = '';
    const { error } = await db.from('memo').insert({ content: input.value });
    btn.disabled = false;
    if (error) { msg.textContent = '저장 오류: ' + error.message; return; }
    input.value = '';
    loadMemos();
  });

  loadMemos();
</script>
</body>
</html>
